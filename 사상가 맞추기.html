<title>사상가 맞추기</title>

<div id="app"></div>
<script>
const D={
지눌:[
`과거에 윤회하던 업보(業報)를 돌아보니 … 착한 벗을 만나지 못하여 오랜 겁을 윤회의 세계에 침몰하여 어두운 정신으로 깨닫지 못한 채 온갖 악업(惡業)을 지으며 살았던 시절이 그 얼마였던가.`,
`진리를 닦는 사람들이여, 마음을 잘 챙기고, 탐욕・음욕에 집착하지 말고, 머리에 붙은 불을 급히 끄듯이 알아차리고 돌아보는 것을 잊어서는 안 된다. 무상한 세월은 신속하기만 하고, 이 육신은 아침 이슬과 같이 순식간이며, 목숨은 석양과 같이 곧 저물 것이니, 비록 오늘은 내가 살아 있지만 내일은 보장하기 어렵다. 참으로 명심하고 또 명심해야 할 것이다.`,
`삼계의 고통은 불타는 집과 같으니, 그대로 참고 머물면서 그 기나긴 고통을 달게 받을 수 있겠는가? 윤회를 벗어나고자 한다면 ‘부처’를 찾는 길이 최고이다. 그리고 만약 부처를 찾고자 한다면, 부처란 바로 이 ‘마음’일 뿐이니 마음을 어찌 멀리서 찾을 것인가? 이 몸뚱이를 떠나지 않는다.`,
`점수(漸修)라는 것은 무엇인가? 돈오를 하여 비록 ‘본성’이 부처와 다를 것이 없음을 깨달았으니 시작 없는 과거부터 익혀 온 ‘습기(習氣)’를 단박에 제거할 수 없어서, 깨달음[돈오(頓悟)]에 의지해 닦으면서[점수(漸修)] 점진적으로 변화하여 공부를 이루는 것이다.`,
`무릇 도(道)에 들어가는 문(門)은 많지만 요체를 말하자면 돈오와 점수 두 가지에 지나지 않는다. 비록 돈오와 돈수는 최상의 근기(根機)를 가진 사람이 들어갈 수 있는 것이라고 하지만, 만약 과거를 미루어 볼 것 같으면, 이미 여러 생에 걸쳐 깨달음에 의거하여 수행을 하면서 점차 익혀 오다가 금생(今生)에 이르러 듣는 즉시 깨달아 일시에 모든 것을 마친 것이니 실제를 논한다면 이 또한 먼저 깨닫고 뒤에 닦은 것이다.`,
`자기의 본래 성품이 부처와 다르지 않음을 깨달았다 하더라도 습기(習氣)는 갑자기 버리기 어렵다. 얼음 연못이 전부 물인 것을 알지만 볕의 기운을 빌려야 녹여지는 것처럼 깨달음을 바탕으로 훈습(熏習)하고 닦아야 한다.`,
`먼저 곧장 깨친다는 것[頓悟]은 마치 해가 쨍하고 비추듯이 모든 법(法)을 단번에 밝게 하는 것과 같고, 이후 닦는다는 것은 마치 거울을 닦아서 차츰 빛나게 하는 것과 같다.`,
`자신의 성품이 본래 부처와 다름이 없음을 단박에 깨치더라도 오래된 습기(習氣)는 끝내 제거해 끊기 어렵다. 만약 지혜로써 노력하여 그 습기를 제거하지 않는다면 안식과 평정의 경지에 이를 수 없을 것이다.`
],
사르트르:[
`실존이 본질에 앞선다는 것은 인간이 먼저 세계 속에 실존하고, 만나지며, 떠오른다는 것, 그리고 인간이 정의되는 것은 그 이후의 일이라는 것을 의미한다. 그는 그 스스로가 만들어 가기에 인간 본성은 없다. 인간은 이처럼 실존 이후에 스스로가 구상하는 무엇이기 때문에, 또 인간은 실존을 향한 이 같은 도약 이후에 스스로가 원하는 무엇이기 때문에, 결국 인간은 스스로가 만들어 가는 것과 다른 무엇이 아니다. 이것이 바로 실존주의의 제1원칙이며, 사람들이 주체성이라고 부르는 것이다.`,
`인간은 자유로우며, 인간은 바로 그 자유이다. 왜냐하면 자신이 세계 속에 던져진 이상, 인간은 자신이 하는 모든 것에 대해 책임이 있기 때문이다.`,
`실존주의의 첫걸음은 모든 인간에게 현재의 자신에 대해서 주인이 되도록 하는 것, 그리하여 자신의 실존에 대해 전적인 책임을 지도록 하는 것입니다. 이때 이 말은 인간은 자신의 엄격한 개별성에 대해서만 책임이 있다는 것을 뜻하지 않습니다. 이 말은 인간은 모든 인간에 대해서 책임이 있다는 것을 뜻합니다. …(중략)… 우리가 우리의 이미지를 만듦과 동시에 실존하기를 원한다면 이렇게 만들어진 우리의 이미지는 모든 이를 위해서도, 또 우리 시대 전체를 위해서도 유효합니다. 이와 같이 우리의 책임은 우리가 상상할 수 있는 것보다 훨씬 더 큰 것입니다.`,
`만약 신이 없다면, 실존이 본질에 앞서는 어떤 한 존재가, 그 어떤 개념으로 정의되기 이전에 실존하는 어떤 한 존재가 반드시 있어야 한다. 이 어떤 한 존재란 인간이다. 실존이 본질에 앞선다는 말은 인간이 먼저 세계 속에 실존하고, 인간이 정의되는 것은 그 이후의 일이라는 것을 의미한다.`,
`인간은 존재 이후에 스스로를 원하는 것이기 때문에 스스로가 만들어 가는 것 외엔 아무것도 아니다. 이것은 실존주의의 제1원칙이다.`,
`본질보다 실존이 앞선다는 것은 무엇을 의미하는 것일까? 그것은 인간이 먼저 있어서 세상에 존재하고 세상에 태어난다는 것을 의미하며, 그는 그다음에 정의된다는 것을 의미한다. 인간이란 정의될 수 없다. 처음에는 그가 아무것도 아니기 때문이다.`,
`신의 존재에 대한 유력한 증명자일지라도 사람 자신 말고는 사람을 구원하지 못하리라는 것을 명심해야 한다. 문제는 신의 존재에 관한 것이 아니며 인간은 자신을 재발견해야 한다. 인간은 항상 스스로를 만들어 가야 하는 존재이므로, 인간을 불변의 목적으로 삼아서는 안 되며, 절대적으로 우러러볼 보편적 인간성이 있다고 믿어서도 안 된다.`,
`인간이란 존재는 본질을 앞서는 존재이며 자유로운 존재이다. 이러한 인간은 자신의 자유와 동시에 타인의 자유를 원하지 않을 수 없으며, 타인의 자유를 목적으로 삼을 때만 나의 자유를 목적으로 삼을 수 있다. 나는 완전한 자유를 스스로 은폐하는 사람들을 비겁한 자들이라고 부르며, 인간의 존재가 필연적이라고 주장하는 사람들을 떳떳하지 못한 자들이라고 부른다.`,
`인간은 자유롭도록 운명 지어진 존재이다. 우리는 자유에 관해서 자유 그 자체 이외에 어떤 한계도 발견할 수 없을 것이다. 우리는 자유로운 것을 그만두는 것에 대해서는 자유롭지 않다.`,
`한 자루의 종이칼과 같은 사물은 그것을 만든 제작자가 설정한 목적에 따라 만들어진 것으로 그 본질은 제작자의 구상에 의해 이미 결정되어 있다. 그러나 인간은 이와 다르게 실존이 본질에 앞선다.`,
`인간은 자유롭도록 선고받았다. 인간은 스스로를 창조한 것이 아니기 때문에 자유롭도록 선고받은 것이요, 세상에 내던져진 이상 자신이 행하는 모든 것에 대해서 책임이 있기 때문에 자유로운 것이다.`
],
엘리아데:[
`창공은 고개를 들어 그것을 바라보는 것만으로 종교적인 체험을 불러일으킨다. 하늘은 그 자신을 무한한 것, 초월적인 것으로 보여 준다. ‘지고자(至高子)’의 개념이 저절로 신성의 속성이 된다. 인간이 접근할 수 없는 높은 지역, 별이 빛나는 영역은 초월자, 절대적인 실재, 영원성의 중대성을 획득한다. 이 모든 것은 논리적・합리적 작용으로 도달되는 것이 아니다. 하늘을 보면서 그는 신성의 측량 불가능성과 우주 안에서 자신의 상태를 발견한다. 왜냐하면 하늘은 그 존재 양식에 의해 이미 초월성, 힘, 영원성을 계시하기 때문이다. 하늘은 높고, 무한하고, 영원하고, 힘이 있어서 절대적으로 존재한다.`,
`세계는 성스러운 것, 존재의 다양한 양태를 발견하는 방식으로 드러난다. 무엇보다도 세계는 실존하고, 실제로 거기에 있고, 그리고 어떤 구조를 가지고 있다. 세계는 신들의 작품인 피조물로 자신을 드러낸다. 이 신의 작품은 스스로 성스러운 것의 여러 양상을 계시한다.`,
`종교가 없는 사람의 대다수도 여전히 유사 종교와 타락한 신화를 가지고 있다. 이것은 하나도 놀라울 것이 없다. 왜냐하면 세속적인 인간은 종교적 인간의 후예이며, 그는 자신의 역사를 지워버릴 수 없기 때문이다. 즉 오늘날 그를 있게 한 종교적 선조들의 행동을 지워 버릴 수가 없는 것이다. 그의 실존의 큰 부분이 그의 존재의 깊은 곳, 무의식이라 불리는 영역에서 발하는 충동으로 키워진다고 생각한다면 이 점은 더욱더 확실해진다. 순수하게 이성적 인간이란 하나의 추상일 뿐 현실 생활에서는 결코 그런 인간을 발견할 수 없다. 모든 인간은 의식적인 활동과 비합리적인 체험으로 구성된다. 이 무의식의 내용과 구조는 신화적 이미지 및 형상과 놀랄 만한 유사성을 보여 준다. 무의식의 내용과 구조는 태고의 실존적 상황, 특히 위기의 상황이 낳은 결과이다. 이 때문에 무의식은 종교적인 분위기를 갖게 된다.`,
`인간이 성스러움[聖]을 아는 것은 그것이 속된 것[俗]과는 전혀 다른 어떤 것으로서 스스로를 현현(顯現)하여 보여주기 때문이다. 성스러움이 현현함으로써 사물은 어떤 전혀 다른 것이 되는데, 그러나 그 후에도 의연히 그 사물은 변하지 않는다. 종교적 경험을 가진 인간에게는 모든 자연이 우주적 신성성으로 계시된다. 그런데 성스러운 돌, 성스러운 나무는 돌이나 나무로서 숭배되는 것이 아니고, 그것을 숭배하는 것은 그것이 성현이기 때문이며 나무가 아니라 성스러운 것, 전혀 다른 어떤 것을 나타내기 때문이다.`,
`성(聖)스러움은 속(俗)된 것과 대조를 이룬다. 인간이 성스러움을 아는 것은 성스러운 것이 속된 것과는 전혀 다른 어떤 것으로서 스스로를 현현(顯現)하고 보여 주기 때문이다.`,
`근대의 비종교적 인간은 종교적 인간의 후예이므로 종교적 인간의 산물이다. 그렇기 때문에 자신의 과거를 전적으로 폐기한다는 것은 불가능하다. 그의 존재 가장 깊은 곳에는 여전히 종교성이 재현될 준비가 되어 있다.`,
`종교적 인간에게 자연은 결코 단순한 자연이 아니다. 우주는 신의 창조물이고, 세계는 신들의 손으로 완성된 것이어서 성스러움으로 가득 차 있기 때문이다. 종교적 인간은 세계와 우주적 현상의 구조 그 자체 안에서 다양한 성(聖)의 양태를 현현(顯現)한다. 한편 비종교적 인간은 초월성을 거절하며 실재의 상대성을 인정한다. 심지어 존재의 의미를 의심하는 데까지 나아가기도 한다.`,
`성스러움이 현현(顯現)함으로써 사물은 전혀 다른 것이 되는데, 그 후에도 의연히 그 사물임은 변하지 않는다. 왜냐하면 그것은 그 후에도 우주적인 환경 세계에 관여하고 있기 때문이다. 종교적 경험을 가진 인간에게는 모든 자연이 우주적 신성성으로 계시된다. 그때 우주는 전체가 성현(聖顯)이 되는 것이다.`
],
정약용:[
`‘하늘이 명한 것을 성(性)이라고 한다.’라는 것은 하늘이 사람을 태어나게 한 그 처음에 허령한 본체 가운데에 덕을 좋아하고 악을 부끄러워하는 성을 부여했다는 것이니, 성을 본체라고 이름 붙일 수 없다. 성이라는 것은 좋아함[嗜好(기호)]과 싫어함[厭惡(염오)]으로 이름 지어야 한다.`,
`기질지성(氣質之性)이 이미 기호(嗜好)로서 이름을 얻었으면 천명지성(天命之性)도 마땅히 기호로서 그 의미를 찾아야 할 것이다. 기질지성은 단 것을 좋아하고 쓴 것을 싫어하며 향기를 좋아하고 악취를 싫어하는 것이며, 천명지성은 선을 좋아하고 악을 미워하며 의를 좋아하고 탐욕을 미워하는 것이다.`,
`우리의 영체(靈體) 안에는 본래 욕구[欲(욕)]의 일단이 있다. 만약 욕구가 없다면 천하의 수많은 일을 해 나갈 수 없다. 오로지 이익[利(이)]에 밝은 자의 욕구는 이익을 좇아서 꿰뚫어 나가며, 의리에 밝은 자의 욕구는 도의[義(의)]에 따라 꿰뚫어 나간다.`,
`하늘은 사람에게 자주지권(自主之權)을 주어 그가 선을 행하고자 하면 선을 행하게 하고 악을 저지르고자 하면 악을 저지르게 하여, 선과 악을 행하려는 방향이 고정되지 않게 하였다. …(중략)… 그런데 선을 행할 수도 악을 행할 수도 있는 이치가 이미 서로 반반이면, 그 죄는 마땅히 반감되어야 할 듯하지만, 죄를 지어 그 책임을 피할 수 없는 이유는 성(性)이 선한 점 때문이다. 성이 선을 좋아하고 악을 부끄러워하는 것이 분명한데 이 성을 거슬러 악을 저지른다면 그 죄를 면할 수 있겠는가?`,
`인의예지란 명칭은 일을 행한 뒤에 이루어지는 것이다. 사람을 사랑한 뒤에 그것을 일컬어 인(仁)이라고 하니 사람을 사랑하기 전에는 인이라는 명칭이 성립하지 않는다. …(중략)… 어찌 인의예지의 네 알맹이가 또렷하게 복숭아와 살구의 씨처럼 사람의 마음속에 덩어리로 들어 있겠는가?`,
`마음속에서 발현되는 측은지심을 이끌어 기른다면 어진 정치를 행할 수 있으니 측은지심이 어진 정치의 시작이 되는 바가 아니겠는가? 마음 속에서 발현되는 사양지심을 이끌어 기른다면 예법을 행할 수 있으니 사양지심이 예법이 시작되는 바가 아니겠는가? 이를 실에 비유하면 측은지심은 실뭉치와 같으니 이것을 풀어내고 뽑아내면 효제를 할 수 있으니, 단(端)이 시작[始]이라는 뜻이 분명하다.`,
`사람의 본성을 논하건대, 사람은 선을 즐거워하고 악을 부끄러워하는 경향이 있다. 그러므로 한 가지 선을 행하면 그 마음은 뿌듯하게 기쁘고, 한 가지 악을 행하면 그 마음은 위축되어 풀이 죽는다.`,
`백성에 대한 애정은 절약해서 쓰는 데 있다. 절약해서 쓰려면 검소해야 한다. 검소하게 생활할 수 있어야 청렴해지고 청렴한 뒤라야 자애로울 수 있으니, 검소한 생활이 목민하는 데 가장 힘써야 할 일이다. 청렴은 세상에서 가장 이익이 많이 남는 장사이다. 욕심이 많은 사람이라면 반드시 청렴하려 한다. 사람이 청렴하지 못한 것은 그 지혜가 짧기 때문이다. 목민관이 청렴하지 않으면 백성은 그를 도둑으로 지목하여 마을을 지날 때 더럽다고 욕하는 소리가 높을 것이니, 이 또한 수치스럽기 짝이 없는 일이다.`,
`수령은 백성을 편안히 할 방책을 헤아려 지성으로 잘되기를 강구해야 한다. 또한 청렴하지 않으면 백성이 도둑이라고 욕할 것이니 탐욕을 경계해야 한다. 청렴은 선정(善政)의 원천이자 덕행의 근본이다.`,
`사사로운 씀씀이를 절약하는 것은 보통 사람도 할 수 있지만, 나라 곳간을 절약할 수 있는 사람은 드물다. 공공의 것을 마치 내 것처럼 소중하게 여겨야 어진 목민관이다.`,
`목민관은 자신의 생일에 관청 사람들이 성찬을 바치더라도 받아서는 안 된다. 받지 않고 오히려 내어놓는 바가 있더라도, 공공연히 말하지 말고 자랑하는 기색을 나타내지도 말라.`,
`부임 인사를 할 때는 자신의 재능과 기량의 부족함을 말할 뿐 녹봉의 많고 적음을 말하지 말아야 한다.`,
`벼슬을 잃게 되더라도 미련을 갖지 않으면 백성들이 그를 존경할 것이다. 벼슬 버리기를 헌신짝 버리듯 하는 것이 옛사람들의 의로움이다.`,
`목민관이 백성을 위해서 있는 것인가? 백성이 목민관을 위해서 있는 것인가? 백성이 곡식과 옷감을 생산하여 목민관을 섬기고, 또 이동수단과 종을 내어 목민관에 음식을 대접하고 보내는 송별회도 하고 환영도 하며, 또는 백성들의 피땀을 짜내어 목민관을 살찌우고 있으니 백성이 과연 목민관을 위하여 있는 것일까? 아니다. 그렇지 않다. 목민관이 백성을 위하여 있는 것이다.`,
`절도 있게 행동하고 의복은 단정하게 입으며 장중한 태도로 백성을 대하는 것이 옛사람들의 법도였다.`,
`청렴은 목민관의 본분으로 온갖 선행의 원천이고 모든 덕행의 근본이다. 따라서 청렴하지 않으면서도 백성을 이끌 수 있는 사람은 있었던 적이 없다.`,
`무릇 조정의 고관이 사사로운 편지를 보내어 뇌물을 청탁하는 것을 들어주면 안 된다.`,
`인(仁)이란 사람과 사람을 겹친 글자이다. 아버지와 자식은 두 사람이다. 형과 아우는 두 사람이다. 임금과 신하는 두 사람이다. 관리와 백성은 두 사람이다. 두 사람의 사이에서 그 본분을 다하는 것을 인이라 한다.`
],
칸트:[
`자연의 모든 것은 법칙에 따라 작동한다. 오직 이성 존재만이 법칙의 표상에 따라서, 곧 원리에 따라서 행위하는 능력을 가진다.`,
`그 준칙이 보편적 법칙이 되기를 네가 동시에 의욕할 수 있는 그런 준칙에 따라서만 행위하라. …(중략)… 마치 너의 행위의 준칙이 너의 의지에 의해 보편적 자연법칙이 되어야 하는 것처럼 그렇게 행위하라.`,
`인간과 모든 이성 존재는 목적 그 자체로 존재하며, 이러저러한 의지의 임의적 사용을 위한 한낱 수단으로 존재하는 것이 아니다. 따라서, 자신을 향하든 다른 이성적 존재를 향하든 이들은 모든 행위에서 자신들을 항상 동시에 목적으로 고려하여야 한다.`,
`생각을 거듭할수록 감탄과 경외로 나의 마음을 가득 채우는 두 가지가 있다. 하나는 나의 머리 위에 별이 총총히 빛나는 하늘이며, 다른 하나는 내 안의 도덕 법칙이다.`,
`의무에서 비롯된 행위의 도덕적 가치는 그 행위로 성취해야 할 의도에 있는 것이 아니라 그 행위를 결심할 때 따르는 준칙에 있다. 따라서 그 행위는 행위의 대상이 실현되는지에 좌우되는 것이 아니라, 행위를 할 때 욕구 능력의 모든 대상을 무시하고 따르는 의지의 원리에만 좌우되는 것이다. 우리가 행위를 할 때 의도할 수 있는 행위 결과는 결코 행위에 무조건적인 도덕적 가치를 부여할 수 없다.`,
`이 세계에서 아무런 제한 없이 선하다고 생각될 수 있는 것은 오직 선의지뿐이다. …(중략)… 선의지는 어떤 목적 달성에 쓸모 있기 때문에 선한 것이 아니라 그 자체로 선한 것이다. 유용성이니 무익함이니 하는 것은 선의지가 지닌 가치에 아무것도 증강시킬 수 없다.`,
`선의지는 그것이 실현하거나 성취한 것 때문에, 또는 이미 주어진 어떤 목적을 달성하는 데 쓸모가 있기 때문에 선한 것이 아니라 오로지 그렇게 하기로 마음먹는 그 자체로 선한 것이다.`,
`의지의 자율은 모든 도덕법칙들과 그에 따르는 의무들의 유일한 원리이다. 이에 반해 자의(恣意)의 모든 타율은 전혀 책무를 정초하지 못할 뿐만 아니라, 오히려 책무 및 의지의 도덕성 원리에 맞서 있다.`,
`모든 이성적 존재자는 단지 수단이 아닌 목적 그 자체이다. 이는 그 자신을 향한 행위에서뿐만 아니라 다른 이성적 존재자를 향한 모든 행위에서도 동일하게 타당하다. 이성이 없는 존재라면, 단지 수단으로서 상대적 가치만을 가지며 물건이라 일컫는다. 그에 반해 이성적 존재자는 인격이라 불린다. 왜냐하면 이성적 존재자는 인격을 아무렇게나 수단으로 사용하려는 자기 생각을 제한하기 때문이다.`,
`행위의 모든 도덕적 가치의 본질적인 면은 도덕 법칙이 의지를 직접적으로 규정한다는 점에 있다. 의지 규정이 도덕 법칙을 좇아 일어난다고 해도, 그러나 어떤 종류의 것이 됐든 감정을 매개로 해서만 일어난다면, 그 행위는 도덕성을 포함하지 않는다.`,
`동정심으로부터 나온 행위는 칭찬과 격려를 받을 만하지만 존중받을 만한 것은 못 된다. 왜냐하면 동정심으로부터 나온 행위는 의무로부터 행하는 윤리적 내용이 결여되어 있기 때문이다.`,
`이성적 존재자만이 법칙의 표상을, 다시 말해 원리들에 따라 행위하는 능력 내지 의지를 가지고 있다. 법칙들로부터 행위들을 이끌어내는 데는 이성이 요구되므로, 의지는 실천 이성 외에 다른 아무것도 아니다. 만약 이성이 의지를 반드시 규정한다면, 객관적으로 필연적인 것이라고 인식된 행위들은 주관적으로도 필연적이다.`,
`거짓된 약속이 의무에 맞는가 맞지 않는가라는 과제에 대답하기 위해 나는 스스로 이렇게 묻는다. ‘진실하지 않은 약속으로 어려움에서 빠져나오라.’라는 나의 준칙이 보편적 법칙으로 적용되어야 한다는 것을 내가 기꺼이 용납할 것인가? 그리고 어려움이 닥쳐서 다른 방법으로 빠져나올 수 없을 때는 누구든지 진실하지 않은 약속을 해도 좋다고 나 자신에게 기꺼이 말할 수 있을 것인가? 이렇게 해서 나는 비록 거짓말을 하려고 할 수는 있어도, ‘거짓말하라.’가 보편적 법칙이 되게 하려고 할 수는 없다는 것을 곧 깨닫는다.`,
`희망 없는 깊은 슬픔과 불행이 어떤 사람의 생에 대한 흥미를 완전히 앗아 갔음에도, 이 사람이 죽음을 원하면서도 영혼의 힘이 강해서 그의 생명을 보존한다고 하자. 이때 그가 자신의 생명을 사랑해서 또는 경향성에서 그러한 것이 아니라 의무로부터 그러하다면, 그의 준칙은 도덕적 가치를 갖는다.`,
`내 위의 별이 빛나는 하늘과 내 안의 도덕 법칙, 나는 이 둘을 마치 어둠 속에 감춰져 있는 것처럼 찾거나 추측하지 않는다. 나는 이 둘을 눈앞에서 보고 나의 존재 의식과 직접 연결시킨다. 도덕 법칙은 나의 인격성에서 출발하고, 참된 무한성을 갖는, 그러나 지성에 의해서만 감지되는 세계, 즉 예지계 속에서 나를 나타낸다. 예지계와 나의 연결을 결코 우연적이 아니라 보편적이고 필연적임을 나는 인식한다.`,
`이성은 실천적 능력으로서, 즉 의지에 영향을 주어야 할 능력으로서 우리에게 부여되어 있다. 따라서 이성의 진정한 사명은 다른 의도에 이바지하는 수단으로서 선한 의지가 아니라, 그 자체로서 선한 의지를 낳는 것이어야 한다.`
],
롤스:[
`사회의 각 구성원들은 정의에 입각한, 또는 어떤 사람들이 말했듯이 자연권에 입각한 불가침성(inviolability)을 지니고 있으며, 이는 다른 모든 사람의 복지라는 명목으로도 유린될 수 없는 것이다. 정의는 어떤 사람들의 자유의 상실이 다른 사람들이 갖게 될 보다 큰 선에 의해 정당화되는 것을 부인한다. 상이한 개인들의 이익과 손실을 마치 그들이 한 사람인 것처럼 비교 평가하는 추론 방식은 배제되는 것이다. 따라서, 정의로운 사회에 있어서는 기본적 자유가 기정사실로 인정되며, 정의에 의해 보장된 권리들은 정치적 흥정이나 사회적 이득의 계산에 희생될 수 없는 것이다.`,
`역사적・사회적 행운에 의해 소득과 부가 분배되는 것을 허용할 이유가 없는 것처럼 천부적 자산(능력과 재능)에 따라 소득과 부가 분배되는 것도 허용할 이유가 없다. 더욱이 가족 제도가 존재하는 한 기회균등의 원칙은 오직 불완전하게만 달성될 뿐이다. 천부적 능력이 계발되고 성숙하는 정도는 모든 종류의 사회적 여건과 계급 양태에 영향을 받는다. 노력하고 힘쓰며 일반적인 의미에서 가치 있는 존재가 되고자 하는 의욕 그 자체까지도 행복한 가정 및 사회적 여건에 의존한다.`,
`몇 사람이 케이크를 나눈다고 할 때 공정한 분할을 동등한 분할이라 한다면 도대체 어떤 절차가 이런 결과를 가져올 것인가? 전문적인 방법을 제외하면 분명한 해결책은 어떤 한 사람이 케이크를 자르고 다른 사람들이 그보다 먼저 케이크를 집어 가게 한 후 그는 가장 나중의 조각을 갖는 것이다. 이 경우에 그는 케이크를 똑같이 자를 것인데, 왜냐하면 그렇게 해야 자신에게도 가능한 최대의 몫이 보장되기 때문이다.`,
`공정으로서의 정의에서 원초적 입장이라는 것은 전통적인 사회 계약론에서의 자연 상태에 해당한다. …(중략)… 이는 일정한 정의관에 이르도록 규정된 순수한 가상적 상황이다. 이러한 상황이 갖는 본질적 특성은 아무도 자신의 사회적 지위나 계층상의 지위를 모르며, 누구도 자기가 어떠한 소질이나 능력, 지능, 체력 등을 천부적으로 타고났는지를 모른다는 점이다. 심지어 당사자들은 자신의 가치관이나 특수한 심리적 성향까지도 모른다고 가정된다. 정의의 원칙들은 무지의 베일 속에서 선택된다. 그 결과, 원칙들을 선택함에 있어서 아무도 타고난 우연의 결과나 사회적 여건의 우연성으로 인해 유리하거나 불리해지지 않는다는 점이 보장된다. 모든 이가 유사한 상황 속에 처하게 되어 아무도 자신의 특정 조건에 유리한 원칙들을 구상할 수 없는 까닭에 정의의 원칙들은 공정한 합의나 약정의 결과가 된다.`,
`공정으로서의 정의가 갖는 하나의 특징은 최초 상황의 당사자들이 합리적이고 서로 간에 무관심한 것으로 간주된다는 것이다. …(중략)… 합리성이라는 개념은 경제 이론에서 말하는 것처럼 가장 좁은 의미로, 즉 주어진 목적에 대해 가장 효과적인 수단을 취한다는 뜻으로 해석되어야 한다.`,
`첫째, 각자는 다른 사람들의 동등한 자유와 충돌하지 않는 한, 가장 광범위한 형태의 기본적 자유에 대하여 동등한 권리를 가져야 한다. 둘째, 사회적・경제적 불평등은 다음 두 조건을 만족시키도록 편성되어야 한다. 즉, (a) 모든 사람의 이익이 되리라는 것이 합당하게 기대되어야 하며, (b) 모든 사람에게 개방된 직위와 직책이 결부되게 해야 한다.`,
`[순수 절차적 정의] 공정한 기회균등이란 순수 절차적 정의를 구현하는 것이다. 이 경우, 올바른 결과에 대한 독립적인 기준은 없는 대신 바르고 공정한 절차가 있어서 그 절차만 제대로 따르면 내용과 상관없이 그 결과도 공정하게 된다. 이러한 경우는 내기(gambling)에서 볼 수 있다. 내기가 공정하게 이루어졌다면, 다시 말해 이득에 대한 기댓값이 0이며, 그 내기가 자발적으로 이루어졌고, 속임수 등이 없었다면 마지막 판이 끝난 후의 현금이 어떻게 분배되든 공정하거나 적어도 불공정하지는 않을 것이다.`,
`정의의 일차적 주제는 사회의 주요 제도가 권리와 의무를 배분하고 사회 협동체로부터 생긴 이익의 분배를 정하는 방식이다. 이를 정하는 정의의 원칙은 당사자들의 원초적 합의의 대상이다. …(중략)… 모든 사회적 가치는 이러한 가치의 일부 또는 전부의 불평등한 분배가 모든 사람에게 이득이 되지 않는 한 평등하게 분배되어야 한다.`,
`사회의 기본 구조에 대한 정의의 원칙이 원초적 합의 대상이다. 그것은 자신의 이익 증진에 관심을 가진 자유롭고 합리적인 사람들이 평등한 최초의 입장에서 그들 조직체의 기본 조건을 규정하는 것으로 채택하게 될 원칙이다. 정의의 원칙을 이렇게 보는 방식을 나는 ‘공정으로서의 정의’라 부르고자 한다.`,
`정의의 원칙은 무지의 베일 속에서 선택된다. 그 결과, 원칙들을 선택할 때 타고난 재능이나 사회적 여건의 우연적 요소로 인해 그 누구도 유리하거나 불리해지지 않는다는 점이 보장된다.`,
`공정으로서의 정의에서 원초적 입장은 순수한 가상 상황으로 규정된다. 이 가상 상황에서 자유롭고 평등한 합리적 인간들은 정의의 원칙들을 선택하게 될 것이다.`,
`원초적 입장의 사람들은 누구도 자신이 처한 우연적 여건을 알지 못한다. 이러한 상황에 놓인 사람들은 자신이 가장 불리한 상황에 놓일 가능성을 염두에 두고 정의의 원칙에 합의하게 된다.`,
`무지의 베일은 당사자들이 속할 사회에서 그들의 위치를 확인할 근거를 차단한다. 이로 인해 특정한 정의관에 대한 만장일치의 선택이 가능해진다.`,
`도덕적 관점에서 볼 때 자연적 자산은 자의적이기 때문에, 개인은 자신의 더 큰 천부적 능력을 사회에 있어서 더 유리한 출발점으로 이용할 자격은 없다.`,
`차등의 원칙은 사회적 협동을 위한 기본 원칙이다. 이 원칙은 천부적 재능을 가진 사람들이 불우한 사람들을 돕는 한에서 각자의 자질을 사용하게 된다.`,
`사람이 천부적으로 타고난 것이나 사회의 어떤 특정한 지위에 태어나는 것은 정의롭다거나 부정의하다고 할 수 없다. 이것은 단지 자연적 사실에 불과하다. 정의 여부가 문제되는 것은 제도가 그러한 사실들을 처리하는 방식이다.`,
`분배적 정의의 중심 문제는 사회 체제의 선택이다. 정의의 원칙들은 기본 구조에 적용되며 그 주요 제도들이 하나의 체계로 결합되는 방식을 규제하는 것이다. 공정으로서의 정의의 이념은 특수한 상황의 우연성을 처리하기 위해서 순수한 절차적 정의의 관념을 이용하고 있다.`,
`기본적 자유들은 서로 상충할 수 있기에 조정되어야 하지만, 가능한 한 가장 광범위하게 보장되어야 한다. 하지만 최소 수혜자에게 이익이 되고 직위와 직책의 기회가 공정하다면 재산 및 소득의 분배는 균등할 필요가 없다.`
],
노직:[
`모든 사람은 취득과 이전, 교정의 원칙에 의해 자신의 소유물에 대한 소유 권리를 가져야 한다. 소유 권리는 과거의 상황이나 과거의 행위에 근거하므로 분배적 정의는 역사적 원리에 따라야 한다.`,
`최소 국가는 정당화될 수 있는 유일한 국가이다. 최소 국가보다 더 포괄적인 국가는 개인들의 권리를 침해한다. …(중략)… 소유물을 취득한 자는 그 소유물에 대한 소유 권리가 있다. 그리고 소유물에 대한 소유 권리가 있는 사람으로부터 소유물을 받은 사람은 그 소유물에 대한 소유 권리가 있다. 소유물을 취득하고 이전하는 과정에서 부정의가 발생할 경우 이를 교정해야 한다.`,
`개인은 자신의 정당한 소유물에 대한 배타적이고 절대적인 권리를 지닌다. 취득과 이전에서의 정의의 원리 또는 교정의 원리에 의해 어떤 소유물에 대한 권리를 부여받았다면 그 권리는 정당하다.`,
`정의로운 분배의 충분조건은 자신이 소유하는 것을 가질 권리를 소유함이다. 정의로운 상황으로부터 정의로운 단계를 거쳐 발생한 것은 무엇이든 정의롭다.`,
`국가에 관한 우리의 결론에 따르면, 강요, 절도, 사기 등으로부터의 보호와 같은 최소한의 기능에 그 역할이 국한된 최소국가만이 도덕적으로 정당화된다.`,
`분배가 정의로운가는 그 분배가 어떻게 이루어졌는가에 달려있다. 이러한 역사적 원리에 따르면, 사람들의 과거 행위나 상황은 사물에 대한 차별적인 소유 권리나 응분의 자격을 만들어 낸다.`,
`도덕적 관점에서 볼 때 자연적 자산이 자의적이건 아니건 상관없이 개인은 이에 대한 소유 권리를 지니며 이로부터 창출되는 결과물에 대해서도 그러하다.`,
`정형화된 분배의 원리는 재분배 행위를 필요로 한다. 소유 권리론의 관점에서 재분배는 사실상 사람들의 권리 침해 행위를 포함하기 때문에 심각한 문제이다.`,
`분배적 정의의 완결된 원리는 오직 다음일 것이다. 어떤 분배가 정의로울 충분조건은 그 분배하에서 모든 사람이 자신이 소유하고 있는 것에 대한 소유 권리를 소유함이다. 소유물에서의 정의의 세 원리는, 소유물 취득의 원리, 소유물 이전의 원리, 이 두 원리의 위반을 교정하는 원리이다.`,
`차등의 원칙은 정의를 위한 공정한 기반을 제시하지 못한다. 개인의 천부적 재능과 이로부터 나오는 것에 대한 소유 권리는 그 개인에게 있다.`
],
밀:[
`보통 사람들에게는 각자가 직접 부딪히고 경험하는 것, 즉 정당, 집단, 교회, 계급 등이 모여 이 세계를 구성한다. 이들 보통 사람들은 자기가 속한 집단의 권위에 대한 믿음이 어찌나 단단한지, 다른 시대나 국가, 집단이나 교회, 계급, 그리고 정당 등이 자기 집단과 정반대로 생각해 왔고 지금도 그렇게 생각한다는 사실을 알더라도 전혀 영향을 받지 않는다.`,
`사람들은 자신의 기호를 즐기고 자기가 희망하는 것을 추구할 자유를 지녀야 한다. 각각의 개성에 맞게 자기 삶을 설계하고 자기 좋은 대로 살아갈 자유를 누려야 한다.`,
`인간은 오류를 범하지 않는 절대적인 존재가 아니다. 인간이 아는 진리란 대부분 반쪽짜리 진리일 뿐이다. 인간이 진리의 모든 측면에 대해 지금보다 훨씬 더 잘 알 수 있을 때까지는, 의견 일치도 반대쪽 의견이 최대한 자유롭게 피력된 끝에 이루어진 것이 아니라면 바람직하다고 할 수 없다. 다양함은 나쁜 것이 아니라 오히려 좋은 것이라는 사실은 개인의 의견 못지않게 행동 양식에도 적용될 수 있다.`,
`첫째, 침묵을 강요당하는 모든 의견은 그것이 어떤 의견인지 우리가 확실히 알 수는 없다 하더라도, 진리일 가능성이 있다.
둘째, 침묵을 강요당하는 의견이 틀린 것이라 하더라도, 그것이 일정 부분 진리를 담고 있을지도 모른다. 따라서 대립하는 의견을 서로 부딪치게 하는 것만이 나머지 진리를 찾을 수 있는 유일한 방법이다.
셋째, 통설이 진리일 뿐만 아니라 전적으로 옳은 것이라고 하자. 그렇다 해도 어렵고 진지하게 시험을 받지 않으면 그것을 받아들이는 대부분의 사람은 그 진리의 합리적인 근거를 그다지 이해하지도 못한 채 그저 하나의 편견과 같은 것으로만 간직할 것이다.
넷째, 기존 통설의 의미 자체가 실종되거나 퇴색하면서 사람들의 성격과 행동에 큰 영향을 끼치지 못할 것이다.`,
`인간은 오류를 범하지 않는 절대인 존재가 아니다.`,
`사람들에게는 세속의 권력자 또는 신이 좋아하거나 싫어할 것이라고 생각되는 바를 맹목적으로 추종하는 노예근성 같은 것이 있다. 이것은 법이나 여론의 특정 행동을 촉구하거나 금지시키는 행동 규칙을 결정하는 또 다른 중요한 기준이 된다.`,
`과거의 뛰어난 사람들 가운데 대다수는 오늘날의 우리가 보기에는 틀린 생각을 하고 있었으며, 오늘날 아무도 수긍하지 못할 수많은 일을 주장하거나 행동으로 옮겼다.`,
`정치 영역에서의 ‘다수의 횡포’는 온 사회가 경계하지 않으면 안 될 큰 해악 가운데 하나로 분명히 인식되고 있다.`,
`그런 결정을 내린 특정 시대, 특정 국가의 사람들은 다른 사람들도 오래전부터 늘 자신들과 똑같은 생각을 해 왔다고 믿으며 이에 대해 추호도 의심하지 않는다. 그들은 자신이 확립한 규칙이 자명하며 누가 봐도 옳다고 여긴다. 거의 모든 사람이 빠지기 쉬운 이런 착각은 관습이 빚어내는 가공할 만한 부작용 가운데 하나이다.`,
`거짓의 유혹을 이겨 낼 수 있을 정도로 진리를 향한 인간의 열정이 뜨거운 것은 아니다. 법적 제재, 사회적 제재가 충분히 가해지면 진리나 거짓을 향한 열정은 중단되고 만다.`,
`자신에 대한 반대 의견까지 폭넓게 수용함으로써, 그리고 자신은 물론 다른 사람에게도 어떤 의견이 왜 잘못되었는지 자세히 설명해 줌으로써, 옳은 의견 못지않게 그릇된 의견을 통해서도 이득을 얻게 되는 것이다.`,
`우리는 모든 주제에 대해 가장 넓은 의미에서의 양심의 자유, 생각과 감정의 자유, 그리고 절대적인 의견과 주장의 자유를 누려야 한다.`,
`인간은 토론과 경험에 힘입어 자신의 과오를 고칠 수 있다. 경험만으로는 부족하다. …(중략)… 잘못된 생각과 관행은 사실과 논쟁 앞에서 점차 그 힘을 잃게 된다.`,
`자신과 반대되는 사람들의 진짜 생각이 무엇인지 차분하게 들어볼 수 있고 정직하게 평가할 수 있는 사람은 존경받을 만하다. 그가 누구이며 어떤 생각을 가졌든지 불리한 것을 과장하지도, 유리한 점을 취하지도 않는 태도가 기본 도덕률이며, 바로 이 위에서 토론이 이루어져야 한다.`,
`타인에게 피해를 주지 않는 한, 각자의 개성을 다양하게 꽃피울 수 있어야 한다.`,
`각종 문제에 대해 모든 사람이, 심지어 악마의 편에 선 것처럼 보이는 사람까지도 자유롭게 온갖 논리를 동원해서라도 자기주장을 펼 수 있게 해주어야 한다.`,
`전체 인류 가운데 단 한사람이 다른 생각을 한다고 하여, 그 사람에게 침묵을 강요하는 일은 옳지 못하다.`,
`하나의 의견이 그 의견을 갖는 자 외에는 무가치한 것이라고 해도, 또 그러한 의견을 갖지 못하게 하는 것이 오직 개인적인 손해에 그친다고 해도, 그러한 손해가 소수자에게만 가해지느냐 아니면 다수자에게도 가해지느냐에 따라 약간 차이가 있을 수는 있다. 그러나 어떤 의견의 표현을 침묵시키는 것의 특별한 해악은 전 인류의 권리를 강탈하는 것과 같다.`
],
공자:[
`세 사람이 길을 가면 반드시 내 스승이 될 만한 사람이 있다.`,
`많이 듣고서 그 가운데 좋은 것을 선택해 따르고, 많이 보고서 잘 기억하는 사람이 타고난 지식인에 버금가는 것이다.`,
`군자(君子)는 천하의 일을 처리함에 있어 어느 한 가지만 옳다고 주장하지도 않고, 또한 안 된다고 부정하지도 않는다. 오로지 만사를 옳고 바르게 의(義)에 따라 처리할 뿐이다.`,
`군자는 남과 화합하되 뇌동하지 않으며[和而不同(화이부동)], 소인(小人)은 뇌동하되 화합하지 않는다[同而不和(동이불화)].`,
`다른 사람들의 이론적인 체계를 무비판적으로 수용만 하고, 자기성찰을 통해 자기의 것으로 만들지 못하면 남에게 끌려만 다닐 것이요, 자기의 이론 체계만을 고집하고 다른 사람들 것과의 대비를 통해 득실을 따져보지 않으면, 그에 대한 신뢰도가 의심스럽게 된다.`,
`유(由)야! 너에게 알고 모르는 것에 대한 정확한 태도를 알려주마. 아는 것을 안다고 하고, 모르는 것을 모른다고 하는 것, 이것이야말로 제대로 아는 것이라 할 수 있느니라.`,
`○○는 네 가지를 하지 않았다. 억측하지 않았고[毋意], 어떤 일이 꼭 그래야 한다고 기대하지 않았고[毋必], 억지 고집을 부리지 않았고[毋固], 자신을 내세우지 않았다[毋我].`,
`○○가 말했다. “배우기만 하고 생각하지 않으면 얻는 것이 없고, 생각만 하고 배우지 않으면 얻는 것도 없고 사람의 정신만 피로하게 만들기 십상이다.”`,
`자공이 ○○께 물었다. “평생토록 실천할 만한 한마디 말이 있다면 무엇이겠습니까?” ○○는 “그것은 서(恕)일 것이다. 내가 바라지 않는 것을 남에게 강요하지 말라는 것이다.”라고 하였다.`
],
하버마스:[
`의사소통적 합리성이란 행위자들 사이에서 의사소통을 통해 자신들의 행위를 결정할 때 행위의 근거, 즉 타당성에 기반하여 행위를 결정짓는 것을 의미하는 것으로 사실성, 정당성, 진정성에서 찾을 수 있다. 모든 타당한 규범은 그것의 일반적 준수가 모든 사람의 이해관계의 충족에 대해 가져올 수 있는 결과와 부작용이 모든 사람에 의해 비강제적으로 수용될 수 있어야 한다.`,
`의사소통의 합리성은 강제 없이 상호 간의 논증적 대화를 통해 보편적 합의에 도달하는 경험을 호소한다. 이를 통해 담론 참여자는 주관적 견해를 극복하고, 이성적 동기에 근거한 공동의 신념으로 인해 상호 주관성을 확인하게 된다.`,
`의사소통 과정에서 발언의 합리성은 근거 제시 가능성에 있다. 또한 담론 참여자가 지닌 태도의 합리성은 자신을 비판에 노출하고, 필요시 논증에 적절히 참여하려는 자세에 있다. 이러한 비판 가능성으로 인해 합리적 발언은 개선될 수 있다.`,
`① 대화 상대를 동등한 인격의 소유자로 대하고 판단력과 지각이 있는 주체로 대해야 함
② 어떤 상황이든 본인이나 다른 대화 상대자를 기만하거나 속일 의도를 가져서는 안 됨
③ 모든 대화 참가자는 타인의 의견을 경청하고 이들의 물음에 개방적으로 답변하고 토론에 임해야 함
④ 인종이나 계급적 편견이나 지위가 대화 상대의 의견을 제지하거나 막기 위한 억압적 수단으로 사용되어서는 안 됨
⑤ 대화 중에 제기된 물음이나 질문에는 그 어떤 금기도 적용되지 않으며 누구도 질문에서 벗어나는 특권을 누릴 수 없음`,
`① 말하고 행위할 수 있는 능력이 있는 모든 주체는 담론에 참여하도록 허용된다.
② 모든 사람은 담론에 어떤 주장도 제기할 수 있고, 어떤 주장에도 의문을 갖는 것이 허용될 수 있다. 또한 자신의 개인적인 바람, 욕구 등도 표현할 수 있다.
③ 어떤 참여자도 내적 강제나 외적 강제로 인해 ①과 ②에 나타나는 권리를 행사하지 못해서는 안 된다.`,
`① 진실성: 자신이 말한 의도를 상대방이 믿을 수 있도록 진실하게 표현해야 함
② 진리성: 진리에 바탕을 두고 말해야 함
③ 정당성: 사회적으로 정당한 규범에 근거해야 함
④ 이해 가능성: 대화의 내용을 서로 이해할 수 있어야 함`,
`공론장에 참여한 당사자들이 실천적 담론의 참여자로서 동의하는 규범만이 정당성을 가질 수 있다. 정당한 실천적 담론은 이상적 의사소통의 일반적 전제 조건에 근거해야 한다.`,
`현대 사회에서는 다양한 사회적 갈등이 발생한다. 이러한 갈등을 합리적으로 해결하기 위한 하나의 방안은 의사소통 이론을 바탕으로 상호 이해를 증진하기 위해 대화를 하는 것이다. 어떤 주장이 정당성을 갖기 위해서는 논증적인 대화인 담론에 참여한 당사자들이 합의에 도달해야 한다. 어떤 사안에 대해 당사자들이 합리적 근거를 제시하는 토론의 과정을 거치면서 주장의 정당성이 확보된다. 보편적인 합의에 도달하기 위해서는 시민들의 적극적인 참여에 의한 공론장이 활성화되어야 한다.`
]
};
const NEAR={
롤스:["노직","밀","칸트"],노직:["롤스","밀","칸트"],밀:["공자","하버마스","노직"],
공자:["밀","하버마스","정약용"],하버마스:["밀","공자","칸트"],칸트:["롤스","정약용","밀"],
정약용:["공자","지눌","칸트"],지눌:["정약용","엘리아데","공자"],
사르트르:["엘리아데","칸트","지눌"],엘리아데:["사르트르","지눌","정약용"]
};
const ALL=[];
for(const k in D)D[k].forEach(q=>ALL.push({a:k,q}));
const app=document.getElementById("app");
let deck=[],i=0,score=0,wrong=[];
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function start(){app.replaceChildren();
  app.append(el("h1",0,"사상가 맞추기"),el("div","muted",ALL.length+"문제"));
  const b=el("button","main","시작");b.onclick=()=>run(ALL);app.append(b)}
function run(list){deck=shuffle(list);i=0;score=0;wrong=[];show()}
function show(){
  if(i>=deck.length)return end();
  const cur=deck[i];app.replaceChildren();
  const top=el("div","top");top.append(el("span",0,(i+1)+" / "+deck.length),el("span",0,"정답 "+score));
  const p=el("div","passage",cur.q);
  const opts=el("div","opts");
  shuffle([cur.a,...NEAR[cur.a]]).forEach(n=>{
    const b=el("button",0,n);
    b.onclick=()=>{
      opts.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===cur.a)x.classList.add("ok")});
      if(n===cur.a){score++}else{b.classList.add("bad");wrong.push(cur)}
      top.lastChild.textContent="정답 "+score;
      const nx=el("button","main",i+1<deck.length?"다음":"결과");
      nx.onclick=()=>{i++;show();window.scrollTo(0,0)};app.append(nx);nx.focus();
    };
    opts.append(b)});
  app.append(top,p,opts)}
function end(){app.replaceChildren();
  app.append(el("div","muted","결과"),el("div","score",score+" / "+deck.length));
  const r=el("div","row");
  if(wrong.length){const w=el("button","main","틀린 "+wrong.length+"문제 다시");w.onclick=()=>run(wrong);r.append(w)}
  const a=el("button",0,"처음부터");a.onclick=start;r.append(a);app.append(r)}
start();
</script>
